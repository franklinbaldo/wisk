[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wisk"
dynamic = ["version"]
description = "Contract-guided agent execution and persistent learning runtime built on OKF."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Franklin Silveira Baldo", email = "franklinbaldo@gmail.com" },
]
dependencies = [
    "okf-parser>=0.45.8",
    "ibis-framework[duckdb]>=9.0",
    "duckdb>=1.0",
    "networkx>=3.2",
    "pydantic>=2.7",
    "cyclopts>=4.0",
    "fastmcp>=3.0",
]

[project.scripts]
wisk = "wikiskill.cli:app"
# Temporary compatibility alias for existing consumers.
wikiskill = "wikiskill.cli:app"

[project.urls]
Homepage = "https://github.com/franklinbaldo/wisk"
Repository = "https://github.com/franklinbaldo/wisk"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "prek>=0.5.1",
    "ty>=0.0.1a0",
    "bandit>=1.8",
    "vulture>=2.14",
]

[tool.hatch.version]
path = "src/wikiskill/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wisk", "src/wikiskill"]

# Consumer bootstrap must work from an installed wheel, not only from this Git checkout.
# These force-includes single-source the normative contracts and canonical learning roles
# that are also used by Wisk's own dogfood bundle.
[tool.hatch.build.targets.wheel.force-include]
"specs" = "wikiskill/_assets/specs"
"knowledge/skills/session-types/experience.md" = "wikiskill/_assets/canonical/session-types/experience.md"
"knowledge/skills/session-types/wiki.md" = "wikiskill/_assets/canonical/session-types/wiki.md"
"knowledge/skills/session-types/skill.md" = "wikiskill/_assets/canonical/session-types/skill.md"
"knowledge/skills/run-specs/experience.md" = "wikiskill/_assets/canonical/run-specs/experience.md"
"knowledge/skills/run-specs/wiki.md" = "wikiskill/_assets/canonical/run-specs/wiki.md"
"knowledge/skills/run-specs/skill.md" = "wikiskill/_assets/canonical/run-specs/skill.md"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.vulture]
paths = ["src/wikiskill", "src/wisk"]
min_confidence = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=wikiskill --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["src/wikiskill"]

[tool.coverage.report]
show_missing = true
fail_under = 80
