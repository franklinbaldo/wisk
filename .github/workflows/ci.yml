name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint (Ruff check)
        run: uv run ruff check .

      - name: Format (Ruff format)
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check

      - name: Security audit (Bandit)
        run: uv run bandit -r src/ -c pyproject.toml

      - name: Dead code check (Vulture)
        run: uv run vulture src/ --min-confidence 80

      - name: Validate PEP 723 Metadata in scripts
        run: uv run scripts/check_pep723.py

      - name: Check Version Sync & Changelog Presence
        run: uv run scripts/check_version.py

      - name: Validate OKF Bundle (Normative Specs Gate)
        run: uv run okf-parser check knowledge/ --require-spec "../specs/{slug}.md" --normative-spec

      - name: Build consumer-installable wheel
        run: uv build --wheel

      - name: Smoke installed consumer golden path
        shell: bash
        run: |
          WHEEL="$GITHUB_WORKSPACE/$(find dist -name 'wisk-*.whl' -print -quit)"
          CONSUMER="$(mktemp -d)"
          cd "$CONSUMER"
          # Exercise the project environment a real consumer uses, not a throwaway
          # tool environment: Wisk is a dependency of the consumer, not a standalone tool.
          uv init --name wisk-consumer-smoke --python 3.12
          uv add "$WHEEL"
          uv run wisk init
          test -f .wisk/manifest.json
          uv run wisk start > first.json
          uv run wisk start > second.json
          python - <<'PY'
          import json

          first = json.load(open("first.json", encoding="utf-8"))
          second = json.load(open("second.json", encoding="utf-8"))
          assert first["state"] == "next"
          assert first["run"]
          assert second["run"] == first["run"]
          assert second["resumed"] is True
          assert second["selection_reason"] == "active-run-resume"
          PY
          find .wisk/knowledge/experiences/runs -name '*.md' -print -quit | grep -q .

      - name: Run Pytest
        run: uv run pytest -v

  test-lower-bounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Lowest Direct Dependencies
        run: uv sync --resolution lowest-direct

      - name: Run Pytest against Lowest Bounds
        run: uv run pytest -v

      - name: Validate OKF Bundle against Lowest Bounds
        run: uv run okf-parser check knowledge/ --require-spec "../specs/{slug}.md" --normative-spec
